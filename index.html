<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Flota</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mb-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Registro de Vehículo</h2>
        
        <div id="alertaError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
            <span class="block sm:inline" id="textoError"></span>
        </div>
        <div id="alertaExito" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
            <span class="block sm:inline">Registro guardado correctamente.</span>
        </div>

        <form id="formularioRegistro" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Placa del Vehículo</label>
                <input type="text" id="placa" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border uppercase" placeholder="ABC-123">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Kilometraje Actual</label>
                <input type="number" id="km" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" placeholder="Ej: 50000">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Horas de Motor</label>
                <input type="number" id="horas" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" placeholder="Ej: 1200">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                Guardar Registro
            </button>
        </form>
    </div>

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Panel de Administración</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Filtrar por Fecha (Opcional)</label>
                <input type="date" id="fechaFiltro" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>
            <button id="btnDescargar" class="w-full bg-gray-800 text-white font-bold py-2 px-4 rounded hover:bg-gray-900 transition">
                Descargar Reporte CSV
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // REEMPLAZA ESTE BLOQUE CON TU CONFIGURACIÓN
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('formularioRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const placa = document.getElementById('placa').value.toUpperCase();
            const km = parseFloat(document.getElementById('km').value);
            const horas = parseFloat(document.getElementById('horas').value);
            const alertaError = document.getElementById('alertaError');
            const textoError = document.getElementById('textoError');
            const alertaExito = document.getElementById('alertaExito');
            
            alertaError.classList.add('hidden');
            alertaExito.classList.add('hidden');

            try {
                const registrosRef = collection(db, "registros");
                const q = query(registrosRef, where("placa", "==", placa), orderBy("fecha", "desc"), limit(1));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const ultimoRegistro = querySnapshot.docs[0].data();
                    if (km < ultimoRegistro.km || horas < ultimoRegistro.horas) {
                        textoError.textContent = `Error: Los valores son menores al último registro (KM: ${ultimoRegistro.km}, Horas: ${ultimoRegistro.horas}). Se ha notificado al administrador.`;
                        alertaError.classList.remove('hidden');
                        // Aquí se integraría la llamada a EmailJS para enviar el correo real
                        return;
                    }
                }

                await addDoc(registrosRef, {
                    placa,
                    km,
                    horas,
                    fecha: new Date().toISOString()
                });

                alertaExito.classList.remove('hidden');
                e.target.reset();
            } catch (error) {
                console.error("Error al guardar: ", error);
                textoError.textContent = "Error de conexión con la base de datos.";
                alertaError.classList.remove('hidden');
            }
        });

        document.getElementById('btnDescargar').addEventListener('click', async () => {
            const fechaFiltro = document.getElementById('fechaFiltro').value;
            let q = collection(db, "registros");

            try {
                const querySnapshot = await getDocs(q);
                let datos = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const fechaLocal = new Date(data.fecha).toISOString().split('T')[0];
                    if (!fechaFiltro || fechaLocal === fechaFiltro) {
                        datos.push(data);
                    }
                });

                if (datos.length === 0) {
                    alert("No hay registros para esta fecha.");
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8,Placa,Kilometros,Horas,Fecha\n";
                datos.forEach(row => {
                    csvContent += `${row.placa},${row.km},${row.horas},${new Date(row.fecha).toLocaleString()}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `reporte_flota_${fechaFiltro || 'completo'}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error("Error al descargar: ", error);
                alert("Hubo un error al generar el reporte.");
            }
        });
    </script>
</body>
</html>
