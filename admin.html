<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Flota</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-4 md:p-8 font-sans flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">Panel de Administración</h2>
        <p class="text-gray-500 text-sm text-center mb-6">Exportación de datos de telemetría</p>
        
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Filtrar por Fecha (Opcional)</label>
                <input type="date" id="fechaFiltro" class="block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:ring-blue-500 focus:border-blue-500">
                <p class="text-xs text-gray-400 mt-1">Deja el campo vacío para descargar todo el historial.</p>
            </div>
            <button id="btnDescargar" class="w-full bg-gray-900 text-white font-bold py-3 px-4 rounded-lg hover:bg-black transition shadow-md">
                Descargar Reporte CSV
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // PEGA AQUÍ TU FIREBASECONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC6ZApOI4Q2llDSkblPYnK5wcQ_hxuOkX8",
            authDomain: "app-gestion-de-flota.firebaseapp.com",
            projectId: "app-gestion-de-flota.firebasestorage.app",
            essagingSenderId: "801593641234",
            appId: "1:801593641234:web:36812ab0499b1bc549cbcb",
            measurementId: "G-BG9TXV3XXM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btnDescargar').addEventListener('click', async () => {
            const fechaFiltro = document.getElementById('fechaFiltro').value;
            const btn = document.getElementById('btnDescargar');
            btn.textContent = "Procesando...";
            btn.disabled = true;

            try {
                const querySnapshot = await getDocs(collection(db, "registros"));
                let datos = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const fechaLocal = new Date(data.fecha).toISOString().split('T')[0];
                    if (!fechaFiltro || fechaLocal === fechaFiltro) {
                        datos.push(data);
                    }
                });

                if (datos.length === 0) {
                    alert("No hay registros para la fecha seleccionada.");
                    btn.textContent = "Descargar Reporte CSV";
                    btn.disabled = false;
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8,Conductor,Placa,Kilometros,Horas,Fecha\n";
                datos.forEach(row => {
                    // Validar si existe el nombre por si hay registros antiguos
                    const nombreConductor = row.nombre ? row.nombre : "No registrado";
                    csvContent += `${nombreConductor},${row.placa},${row.km},${row.horas},${new Date(row.fecha).toLocaleString()}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `reporte_flota_${fechaFiltro || 'completo'}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error("Error al descargar: ", error);
                alert("Hubo un error al generar el reporte.");
            } finally {
                btn.textContent = "Descargar Reporte CSV";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
